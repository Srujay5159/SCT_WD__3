<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Coding Quiz Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="exam-container">

    <!-- HEADER -->
    <div class="header">

        <div>
            <h1>Coding Exam</h1>
            <p>Technical Assessment Portal</p>
        </div>

        <div class="timer-box">
            ⏳ Time Left: <span id="timer">60</span>s
        </div>

    </div>

    <!-- LANGUAGE SELECTION -->
    <div id="languageBox" class="language-box">

        <h2>Select Programming Language</h2>

        <button onclick="startQuiz('html')">HTML</button>
        <button onclick="startQuiz('css')">CSS</button>
        <button onclick="startQuiz('javascript')">JavaScript</button>

    </div>

    <!-- QUIZ SECTION -->
    <div id="quizBox" class="quiz-box" style="display:none;">

        <div class="question-number">
            Question <span id="questionCount">1</span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <input type="text" id="fillInput" placeholder="Type your answer here">

        <div class="button-area">
            <button id="nextBtn">Next Question</button>
        </div>

    </div>

    <!-- RESULT -->
    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
